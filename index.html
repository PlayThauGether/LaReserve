<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Réserve · Play Thau'Gether</title>
<meta name="description" content="Inventaire de tout ce que possède l'association Play Thau'Gether">
<meta name="theme-color" content="#F3F0ED">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="La Réserve">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#24170F;--ink2:rgba(36,23,15,.56);--ink3:rgba(36,23,15,.32);--hair:rgba(36,23,15,.08);
  --terra:#C0522A;--teal:#2F6E62;--dore:#C9A57E;
  --blur:blur(22px) saturate(190%);
  --lg-bg:linear-gradient(160deg,rgba(255,255,255,.46) 0%,rgba(255,255,255,.16) 100%);
  --lg-edge:inset 0 1px 1px rgba(255,255,255,.95),inset 0 -1px 1px rgba(255,255,255,.3),inset 0 0 0 1px rgba(255,255,255,.38);
  --lg-drop:0 12px 32px -14px rgba(40,24,14,.22);
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{font-family:'Poppins',system-ui,sans-serif;background:#F3F0ED;color:var(--ink);font-size:15px;line-height:1.5;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;min-height:100vh;padding-bottom:calc(108px + env(safe-area-inset-bottom))}
body.noscroll{overflow:hidden}
body.noscroll .tabs,body.noscroll .fab{opacity:0;pointer-events:none}
.tabs,.fab{transition:opacity .25s}
h1,h2,h3{font-weight:600;line-height:1.05}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit;text-align:inherit;letter-spacing:inherit}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink);letter-spacing:-.01em}
:focus-visible{outline:2px solid rgba(36,23,15,.5);outline-offset:2px;border-radius:14px}
svg.i{width:20px;height:20px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.hidden{display:none!important}

/* Lumière de la saison derrière le verre */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:#F3F0ED}
.bg i{position:absolute;border-radius:50%}
.bg i:nth-child(1){width:115vmax;height:115vmax;left:-55vmax;top:-60vmax;background:radial-gradient(circle,rgba(192,82,42,.42),rgba(192,82,42,0) 58%)}
.bg i:nth-child(2){width:105vmax;height:105vmax;right:-55vmax;top:5vh;background:radial-gradient(circle,rgba(47,110,98,.34),rgba(47,110,98,0) 58%)}
.bg i:nth-child(3){width:100vmax;height:100vmax;left:-25vmax;bottom:-65vmax;background:radial-gradient(circle,rgba(201,165,126,.6),rgba(201,165,126,0) 58%)}

/* Verre liquide */
.glass,.lgx{background:var(--lg-bg);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:var(--lg-edge),var(--lg-drop);border:none}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass,.lgx,.card,.group,.tabs,.sheet,.top,.showcase,.pillbtn,.back,.chip,.btn.sec{background:rgba(250,247,244,.92)!important}}

/* En-tête */
.top{position:sticky;top:0;z-index:30;padding-top:env(safe-area-inset-top);background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,.12));-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:inset 0 -1px 0 rgba(255,255,255,.5)}
.top-in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 20px}
.top-logo{display:flex;align-items:center;gap:9px}
.top-logo img{height:30px;width:auto;opacity:.92}
.brand{display:flex;flex-direction:column;line-height:1}
.brand b{font-family:'Bebas Neue';font-weight:400;font-size:21px;letter-spacing:.04em;color:var(--terra)}
.brand small{display:none}
.top .sp{flex:1}
.pill{font-size:11px;font-weight:500;padding:4px 10px;border-radius:999px;white-space:nowrap;background:var(--lg-bg);box-shadow:var(--lg-edge);color:var(--ink2)}
.pill-admin{color:var(--teal)}
.pill-admin::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--teal);margin-right:6px;vertical-align:1px}
.desk-nav{display:none;gap:2px;padding:4px;border-radius:999px}
.desk-nav button{display:flex;align-items:center;gap:7px;padding:7px 15px;border-radius:999px;font-size:14px;font-weight:500;color:var(--ink2);transition:background .25s var(--ease),color .25s}
.desk-nav button svg.i{width:17px;height:17px}
.desk-nav button.on{color:var(--ink);background:rgba(255,255,255,.62);box-shadow:inset 0 1px 1px #fff,0 2px 10px -4px rgba(40,24,14,.25)}

/* Barre d'onglets */
.tabs{position:fixed;left:50%;transform:translateX(-50%);width:min(390px,calc(100% - 28px));bottom:calc(14px + env(safe-area-inset-bottom));z-index:30;display:flex;gap:2px;padding:5px;border-radius:999px;background:var(--lg-bg);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:var(--lg-edge),0 16px 40px -14px rgba(40,24,14,.35)}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 4px 6px;border-radius:999px;color:var(--ink2);font-size:10px;font-weight:500;transition:background .3s var(--ease),color .3s}
.tabs button svg.i{width:22px;height:22px}
.tabs button.on{color:var(--ink);background:rgba(255,255,255,.6);box-shadow:inset 0 1px 1px #fff,0 2px 10px -4px rgba(40,24,14,.25)}

main{max-width:1120px;margin:0 auto;padding:30px 20px 24px}
.narrow{max-width:720px;margin:0 auto}

/* Titres */
.hero{padding:6px 2px 0}
.display{font-size:clamp(36px,10vw,56px);font-weight:600;letter-spacing:-.045em;line-height:1;color:var(--ink)}
.display.md{font-size:clamp(30px,8vw,46px);letter-spacing:-.04em}
.lead{font-size:15px;color:var(--ink2);max-width:42ch;margin-top:10px}
.count{font-size:14px;color:var(--ink2);margin:8px 2px 0}
.h2{font-size:17px;font-weight:600;letter-spacing:-.025em;margin:34px 4px 12px}
.kicker{font-size:13px;color:var(--ink2);margin-bottom:8px;display:flex;align-items:center;gap:7px}
.kicker::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c,var(--ink3))}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;font-size:13px;color:var(--ink3);margin-bottom:10px}
.crumbs button{color:var(--ink2);font-weight:500}

/* Recherche */
.search{display:flex;align-items:center;gap:10px;height:48px;padding:0 16px;border-radius:999px;margin-top:24px;cursor:text}
.search svg.i{color:var(--ink3);width:19px;height:19px}
.search input{flex:1;border:none;background:none;outline:none;min-width:0;height:100%}
.search input::placeholder{color:var(--ink3)}
.search input::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}

/* Catégories : simples pastilles de texte */
.shelf{display:flex;gap:8px;overflow-x:auto;margin:16px -20px 0;padding:4px 20px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.shelf::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 15px;border-radius:999px;font-size:13.5px;font-weight:500;color:var(--ink2);white-space:nowrap;background:var(--lg-bg);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:var(--lg-edge);transition:background .25s var(--ease),color .25s}
.chip i{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.chip.on{background:var(--ink);color:#fff;box-shadow:0 6px 16px -8px rgba(36,23,15,.6)}
@media(min-width:960px){.shelf{margin:18px 0 0;padding:4px 0 6px;flex-wrap:wrap}}

/* Icône de catégorie : trait coloré dans une bulle de verre */
.sq{--s:40px;width:var(--s);height:var(--s);border-radius:50%;flex-shrink:0;display:grid;place-items:center;color:var(--c);background:linear-gradient(160deg,rgba(255,255,255,.7),rgba(255,255,255,.25));box-shadow:inset 0 1px 1px #fff,inset 0 0 0 1px rgba(255,255,255,.5),0 4px 12px -6px rgba(40,24,14,.25)}
.sq svg.i{width:calc(var(--s) * .46);height:calc(var(--s) * .46);stroke-width:1.6}
.sq.sm{--s:36px}
.sq.lg{--s:62px}
.sq.xl{--s:148px;box-shadow:inset 0 2px 2px #fff,inset 0 0 0 1px rgba(255,255,255,.55),0 30px 60px -28px rgba(40,24,14,.4)}
.sq.xl svg.i{stroke-width:1.1}

/* Outils */
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}
.pillbtn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 15px;border-radius:999px;font-size:13.5px;font-weight:500;color:var(--ink);background:var(--lg-bg);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:var(--lg-edge)}
.pillbtn svg.i{width:16px;height:16px}
.pillbtn.on{background:rgba(255,255,255,.66)}
.nb{background:var(--ink);color:#fff;border-radius:999px;font-size:10.5px;padding:1px 7px;font-weight:600}
.seg{display:flex;padding:3px;border-radius:999px}
.seg button{width:38px;height:32px;border-radius:999px;display:grid;place-items:center;color:var(--ink3);transition:background .25s,color .25s}
.seg button svg.i{width:17px;height:17px}
.seg button.on{background:rgba(255,255,255,.75);color:var(--ink);box-shadow:inset 0 1px 1px #fff,0 2px 8px -3px rgba(40,24,14,.25)}
.filters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;border-radius:26px;padding:16px;margin-top:12px;animation:drop .3s var(--ease)}
@keyframes drop{from{opacity:0;transform:translateY(-6px)}}
.filters label{font-size:12px;color:var(--ink2);display:flex;flex-direction:column;gap:6px}
.filters select{width:100%;min-width:0;height:42px;padding:0 12px;border-radius:14px;border:none;background:rgba(255,255,255,.55);box-shadow:inset 0 0 0 1px rgba(255,255,255,.6);font-size:15px}
.filters .reset{grid-column:1/-1;justify-self:end;color:var(--ink2);font-size:13px;font-weight:500;padding:4px;text-decoration:underline;text-underline-offset:3px}
@media(min-width:760px){.filters{grid-template-columns:repeat(4,minmax(0,1fr))}}

/* Cartes */
#catRes{margin-top:22px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:960px){.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}}
.card{position:relative;display:flex;flex-direction:column;width:100%;border-radius:28px;overflow:hidden;background:var(--lg-bg);-webkit-backdrop-filter:blur(16px) saturate(180%);backdrop-filter:blur(16px) saturate(180%);box-shadow:var(--lg-edge),var(--lg-drop);transition:transform .35s var(--ease)}
.card:active{transform:scale(.965)}
.stage{position:relative;height:118px;display:grid;place-items:center}
.badge{position:absolute;top:12px;right:12px;font-size:10.5px;font-weight:500;color:var(--terra);padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.6);box-shadow:inset 0 1px 1px #fff}
.card .bd{display:flex;flex-direction:column;gap:2px;padding:0 16px 16px;min-width:0}
.card .nm{font-weight:600;font-size:14.5px;line-height:1.3;letter-spacing:-.02em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.card .r2{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:2px 8px}
.qt{font-size:13px;color:var(--ink2)}
.meta{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--ink3);min-width:0;margin-top:2px}
.meta span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta svg.i{width:12px;height:12px}
.etat{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2);white-space:nowrap}
.etat i{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.etat.lg{font-size:13px;color:var(--ink);padding:6px 13px;border-radius:999px;background:var(--lg-bg);box-shadow:var(--lg-edge)}

/* Listes */
.group{border-radius:26px;overflow:hidden;background:var(--lg-bg);-webkit-backdrop-filter:blur(16px) saturate(180%);backdrop-filter:blur(16px) saturate(180%);box-shadow:var(--lg-edge),var(--lg-drop)}
.item{position:relative;display:flex;align-items:center;gap:12px;width:100%;padding:11px 18px 11px calc(14px + var(--d,0) * 22px);min-height:62px}
.item+.item::before{content:"";position:absolute;top:0;right:0;left:calc(66px + var(--d,0) * 22px);height:1px;background:var(--hair)}
button.item:active{background:rgba(255,255,255,.35)}
.item .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.item .t1{font-weight:500;font-size:15px;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .t1.wrap{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.25}
.item .t2{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink2);min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.item .loc{display:inline-flex;align-items:center;gap:3px;overflow:hidden;text-overflow:ellipsis;color:var(--ink3)}
.item .loc svg.i{width:12px;height:12px}
.item .end{font-size:13.5px;color:var(--ink2);white-space:nowrap;text-align:right;display:flex;flex-direction:column;align-items:flex-end}
.item .end small{font-size:11px;color:var(--terra)}
.chev{color:var(--ink3);display:flex}
.chev svg.i{width:17px;height:17px}
.item .txbtn{flex:1;min-width:0;display:flex;align-items:center;gap:12px}
.tools{display:flex;gap:2px}
.ibtn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--ink2)}
.ibtn:active{background:rgba(255,255,255,.5)}
.ibtn.del{color:var(--terra)}
.ibtn:disabled{opacity:.25}
.ibtn svg.i{width:17px;height:17px}
@media(max-width:480px){.tools .ibtn{width:31px;height:31px}.item .txbtn{gap:10px}}

/* Fiche */
.back{display:inline-flex;align-items:center;gap:3px;height:36px;padding:0 15px 0 9px;border-radius:999px;font-size:14px;font-weight:500;background:var(--lg-bg);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:var(--lg-edge);margin-bottom:16px}
.back svg.i{width:18px;height:18px}
.fiche{display:grid;gap:26px}
.showcase{position:relative;height:300px;border-radius:36px;display:grid;place-items:center;overflow:hidden;background:var(--lg-bg);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:var(--lg-edge),var(--lg-drop)}
.showcase::after{content:"";position:absolute;inset:0;background:radial-gradient(60% 50% at 50% 45%,color-mix(in srgb,var(--c) 16%,transparent),transparent 70%);pointer-events:none}
.showcase .sq{position:relative;z-index:1}
.showcase .badge{z-index:2;top:18px;right:18px;font-size:12px;padding:5px 12px}
.line{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.alert{display:flex;align-items:center;gap:10px;margin-top:14px;padding:12px 16px;border-radius:18px;font-size:13.5px;color:var(--terra);background:rgba(255,255,255,.35);box-shadow:inset 0 0 0 1px rgba(192,82,42,.22)}
.alert svg.i{width:17px;height:17px}
.qty{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:30px 2px 24px}
.qv{display:flex;align-items:baseline;gap:10px;line-height:.85}
.qv b{font-size:76px;font-weight:300;letter-spacing:-.06em}
.qv span{font-size:15px;color:var(--ink2)}
.stepper{display:flex;align-items:center;border-radius:999px;padding:4px}
.stepper button{width:48px;height:42px;border-radius:999px;display:grid;place-items:center}
.stepper button:active{background:rgba(255,255,255,.7)}
.stepper button svg.i{width:20px;height:20px;stroke-width:2}
.stepper span{width:1px;height:20px;background:var(--hair)}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:14px 20px}
.kv+.kv{box-shadow:inset 0 1px 0 var(--hair)}
.kv .k{font-size:14px;color:var(--ink2);white-space:nowrap}
.kv .v{font-size:14px;text-align:right;word-break:break-word}
.lnk{font-weight:500;text-decoration:underline;text-decoration-color:var(--ink3);text-underline-offset:3px}
.tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px}
.tag{font-size:13px;color:var(--ink2);padding:6px 13px;border-radius:999px;background:var(--lg-bg);box-shadow:var(--lg-edge)}
.note{padding:16px 20px;margin-top:16px;font-size:14px;white-space:pre-wrap;word-break:break-word}
.dates{font-size:12px;color:var(--ink3);margin:16px 4px 0}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.actions .btn{flex:1 1 140px}
.subs{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
@media(min-width:900px){
  .fiche{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:56px;align-items:start}
  .fiche-l{position:sticky;top:84px}
  .showcase{height:min(580px,calc(100vh - 170px))}
  .sq.xl{--s:200px}
  .fiche-r{padding-top:56px}
}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:48px;padding:0 22px;border-radius:999px;font-weight:500;font-size:15px;color:#fff;background:var(--ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 10px 24px -12px rgba(36,23,15,.7);transition:transform .2s var(--ease)}
.btn:active{transform:scale(.97)}
.btn svg.i{width:17px;height:17px}
.btn.sec{color:var(--ink);background:var(--lg-bg);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:var(--lg-edge),var(--lg-drop)}
.btn.teal{background:var(--teal)}
.btn.danger{color:var(--terra);background:var(--lg-bg);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:var(--lg-edge)}
.btn:disabled{opacity:.5}
.fab{position:fixed;right:20px;bottom:calc(92px + env(safe-area-inset-bottom));z-index:25;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 14px 30px -12px rgba(36,23,15,.75);transition:transform .2s var(--ease)}
.fab:active{transform:scale(.92)}
.fab svg.i{width:24px;height:24px;stroke-width:2}

/* Vides */
.empty{text-align:center;padding:60px 20px}
.empty h3{font-size:22px;letter-spacing:-.03em;margin-bottom:8px}
.empty p{font-size:14.5px;color:var(--ink2);margin:0 auto 20px;max-width:34ch}
.empty .row-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.banner{border-radius:20px;padding:14px 16px;font-size:13px;margin-bottom:16px;background:var(--ink);color:#F3F0ED}
.banner b{color:var(--dore)}

/* Feuille */
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(36,23,15,.18);animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-height:92vh;overflow-y:auto;overscroll-behavior:contain;padding:10px 20px calc(20px + env(safe-area-inset-bottom));border-radius:34px 34px 0 0;background:linear-gradient(170deg,rgba(255,255,255,.8),rgba(255,255,255,.62));-webkit-backdrop-filter:blur(40px) saturate(190%);backdrop-filter:blur(40px) saturate(190%);box-shadow:inset 0 1px 1px #fff,0 -20px 50px -20px rgba(36,23,15,.35);animation:up .38s var(--ease)}
.sheet::before{content:"";display:block;width:36px;height:5px;border-radius:3px;background:var(--ink3);opacity:.5;margin:0 auto 16px}
@keyframes up{from{transform:translateY(70px);opacity:.3}}
@media(min-width:700px){.modal{align-items:center}.sheet{max-width:560px;border-radius:34px;padding:26px}.sheet::before{display:none}}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:20px}
.mhead h2{font-size:24px;letter-spacing:-.035em}
.x{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--ink2);background:rgba(255,255,255,.55);box-shadow:inset 0 1px 1px #fff}
.x svg.i{width:16px;height:16px;stroke-width:2}

function numOrNull(v) { if (v === '' || v == null) return null; const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) && n >= 0 ? Math.round(n * 100) / 100 : null; }
function intOrNull(v) { if (v === '' || v == null) return null; const n = parseInt(v, 10); return isFinite(n) && n >= 0 ? n : null; }

/* Emplacements : un parent supprimé ou absent rend l'emplacement « principal » */
function parentOf(id) { const l = S.lieux[id]; return l && l.parentId && S.lieux[l.parentId] && l.parentId !== id ? l.parentId : null; }
function lieuPath(id) {
  const out = [], seen = new Set();
  let cur = id;
  while (cur && S.lieux[cur] && !seen.has(cur)) { seen.add(cur); out.unshift(cur); cur = parentOf(cur); }
  return out;
}
function lieuPathText(id) { return lieuPath(id).map(x => S.lieux[x].nom).join(' › '); }
function lieuName(id) { return id && S.lieux[id] ? S.lieux[id].nom : 'Non rangé'; }
function childrenOf(pid) {
  return Object.keys(S.lieux).filter(id => parentOf(id) === (pid || null))
    .sort((a, b) => String(S.lieux[a].nom).localeCompare(S.lieux[b].nom, 'fr'));
}
function treeOrder(id, seen) {
  seen = seen || new Set();
  if (seen.has(id)) return [];
  seen.add(id);
  let out = [id];
  childrenOf(id).forEach(c => { out = out.concat(treeOrder(c, seen)); });
  return out;
}
function descendants(id) { return new Set(treeOrder(id)); }
function rootLieux() {
  const roots = Object.keys(S.lieux).filter(id => !parentOf(id));
  // Sécurité : un emplacement pris dans une boucle de parents est affiché à la racine
  const reach = new Set();
  roots.forEach(r => treeOrder(r).forEach(x => reach.add(x)));
  Object.keys(S.lieux).forEach(id => { if (!reach.has(id)) { roots.push(id); treeOrder(id).forEach(x => reach.add(x)); } });
  return roots.sort((a, b) => String(S.lieux[a].nom).localeCompare(S.lieux[b].nom, 'fr'));
}

function filtered() {
  const words = norm(UI.q.trim()).split(/\s+/).filter(Boolean);
  const lieuSet = UI.lieu && UI.lieu !== '_none' ? descendants(UI.lieu) : null;
  const tagN = norm(UI.tag);
  const arr = objList().filter(o => {
    if (UI.cat === '_none' ? S.cats[o.categorieId] : (UI.cat && o.categorieId !== UI.cat)) return false;
    if (UI.lieu === '_none' && o.emplacementId && S.lieux[o.emplacementId]) return false;
    if (lieuSet && !lieuSet.has(o.emplacementId)) return false;
    if (UI.etat && (o.etat || 'bon') !== UI.etat) return false;
    if (tagN && !tagsOf(o).some(t => norm(t) === tagN)) return false;
    if (words.length) {
      const hay = norm([o.nom, tagsOf(o).join(' '), o.notes].join(' '));
      if (!words.every(w => hay.includes(w))) return false;
    }
    return true;
  });
  const byName = (a, b) => String(a.nom || '').localeCompare(String(b.nom || ''), 'fr', { sensitivity: 'base' });
  const val = o => (Number(o.quantite) || 0) * (num(o.valeurUnitaire) || 0);
  const sorts = {
    nom: byName,
    recent: (a, b) => (b.createdAt || 0) - (a.createdAt || 0) || byName(a, b),
    quantite: (a, b) => (Number(b.quantite) || 0) - (Number(a.quantite) || 0) || byName(a, b),
    valeur: (a, b) => val(b) - val(a) || byName(a, b)

  return arr.sort(sorts[UI.sort] || byName);
}

const qtyLog = {};
function adjustQty(id, d) {
  const o = S.objets[id];
  if (!o || !S.admin) return;
  const q = Math.max(0, (Number(o.quantite) || 0) + d);
  if (q === (Number(o.quantite) || 0)) return;
  save(ref('objets/' + id).update({ quantite: q, updatedAt: TS() }));
  const x = qtyLog[id] || (qtyLog[id] = { d: 0 });
  x.d += d;
  clearTimeout(x.t);
  x.t = setTimeout(() => {
    const cur = S.objets[id];
    if (x.d) logH('Quantité ajustée', cur ? cur.nom : id, `${x.d > 0 ? '+' : ''}${x.d}${cur ? ' (total ' + fmtQty(cur) + ')' : ''}`);
    delete qtyLog[id];
  }, 2500);
}

  if (!sel || !S.cats[sel]) h = `<option value="" ${!sel || !S.cats[sel] ? 'selected' : ''}>Sans catégorie</option>` + h;

}
function lieuOptions(sel, excludeSet, noneLabel) {

  h += lieuxSorted().filter(id => !excludeSet || !excludeSet.has(id))
    .map(id => `<option value="${esc(id)}" ${id === sel ? 'selected' : ''}>${esc(lieuPathText(id))}</option>`).join('');
  return h;
}
function tagEditor(box, initial) {
  const tags = [...initial];
  function add(v) {
    v = String(v || '').replace(/,/g, ' ').trim();
    if (v && !tags.some(t => norm(t) === norm(v))) tags.push(v);
  }
  function draw(focus) {
    box.innerHTML = tags.map((t, i) => `<span class="tagchip">${esc(t)}<button type="button" data-i="${i}" aria-label="Retirer ${esc(t)}">×</button></span>`).join('')
      + `<input id="tagIn" list="dlTags" placeholder="${tags.length ? 'Autre tag…' : 'Ex. Halloween, enfants, fragile'}" enterkeyhint="enter" autocomplete="off">`;
    if (focus) $('#tagIn', box).focus();
  }
  box.addEventListener('keydown', e => {
    if (e.target.id !== 'tagIn') return;
    if (e.key === 'Enter' || e.key === ',') {
      e.preventDefault();
      add(e.target.value); draw(true);
    } else if (e.key === 'Backspace' && !e.target.value && tags.length) {
      tags.pop(); draw(true);
    }
  });
  box.addEventListener('input', e => {
    if (e.target.id === 'tagIn' && e.target.value.includes(',')) {
      e.target.value.split(',').forEach(add); draw(true);
    }
  });
  box.addEventListener('click', e => {
    const b = e.target.closest('button[data-i]');
    if (b) { tags.splice(Number(b.dataset.i), 1); draw(true); }
    else if (e.target === box) $('#tagIn', box).focus();
  });
  draw(false);
  return () => { const inp = $('#tagIn', box); if (inp && inp.value.trim()) add(inp.value); return tags.slice(); };
}

async function delObj(id) {

  const ks = kitsWith(id);
  const extra = ks.length ? `\nIl sera aussi retiré ${ks.length > 1 ? 'des ' + ks.length + ' kits qui le contiennent' : 'du kit « ' + ks[0].nom + ' »'}.` : '';
  if (!await ask(`Supprimer définitivement « ${o.nom} » ?${extra}`, { ok: 'Supprimer', danger: true, title: 'Supprimer' })) return;

}

const CHECK_KEY = 'reserve-check-';
function kitList() {
  return Object.entries(S.kits).map(([id, k]) => ({ id, ...k }))
    .sort((a, b) => String(a.nom || '').localeCompare(String(b.nom || ''), 'fr', { sensitivity: 'base' }));
}
function kitItems(k) {
  const it = k && k.items;
  return (Array.isArray(it) ? it : Object.values(it || {})).filter(x => x && x.objetId)
    .map(x => ({ objetId: x.objetId, quantite: Math.max(1, parseInt(x.quantite, 10) || 1) }));
}
function kitQty(k) { return kitItems(k).reduce((s, it) => s + it.quantite, 0); }
function itemIssue(it) {
  const o = S.objets[it.objetId];
  if (!o) return 'Objet supprimé';
  if (o.etat === 'perdu') return 'Perdu';
  const have = Number(o.quantite) || 0, msgs = [];
  if (have < it.quantite) msgs.push(have ? `Il en manque ${it.quantite - have}` : 'Plus en stock');
  if (o.etat === 'abime') msgs.push('Abîmé');
  if (o.etat === 'reparer') msgs.push('À réparer');
  return msgs.join(', ');
}
function kitIssues(k) { return kitItems(k).map(it => ({ it, msg: itemIssue(it) })).filter(x => x.msg); }
function kitsWith(objId) { return kitList().filter(k => kitItems(k).some(it => it.objetId === objId)); }
function checkState(kitId) {
  try { const c = JSON.parse(lsGet(CHECK_KEY + kitId) || 'null'); if (c && typeof c === 'object') return { depart: c.depart || {}, retour: c.retour || {} }; } catch (e) { /* état illisible */ }
  return { depart: {}, retour: {} };
}
function saveCheck(kitId, st) { lsSet(CHECK_KEY + kitId, JSON.stringify(st)); }

async function delKit(id) {

/* ---------- Éditeur de liste d'objets (kits et sorties) ---------- */
function itemsEditor(root, items, opts) {
  opts = opts || {};
  const sel = $('.kitsel', root), res = $('.kitres', root), q = $('.kq', root);
  const byName = (a, b) => String(a.nom || '').localeCompare(String(b.nom || ''), 'fr', { sensitivity: 'base' });
  const drawSel = () => {
    sel.innerHTML = items.length ? items.map((it, i) => {
      const o = S.objets[it.objetId];
      const w = opts.warn ? opts.warn(it) : '';
      return `<div class="krow"><span class="kn">${esc(o ? o.nom : 'Objet supprimé')}${w ? `<small>${esc(w)}</small>` : ''}</span>
        <span class="mini-step"><button type="button" data-k="dec" data-i="${i}" aria-label="Moins">−</button><input type="number" inputmode="numeric" min="1" value="${it.quantite}" data-k="qty" data-i="${i}" aria-label="Quantité"><button type="button" data-k="inc" data-i="${i}" aria-label="Plus">+</button></span>
        <button type="button" class="kx" data-k="del" data-i="${i}" aria-label="Retirer">×</button></div>`;
    }).join('') : `<p class="khint">${esc(opts.empty || "Aucun objet pour l'instant. Cherche-les ci-dessous.")}</p>`;
  };
  const drawRes = () => {
    const words = norm(q.value.trim()).split(/\s+/).filter(Boolean);
    const inList = new Set(items.map(x => x.objetId));
    let arr = objList().filter(o => !words.length || words.every(w => norm([o.nom, tagsOf(o).join(' ')].join(' ')).includes(w))).sort(byName);
    arr = arr.slice(0, words.length ? 15 : 6);
    res.innerHTML = arr.length ? arr.map(o => {
      const c = catOf(o.categorieId);
      return `<button type="button" class="kadd" data-add="${esc(o.id)}">${catSq(c, 'sm')}<span class="tx"><span class="t1">${esc(o.nom)}</span><span class="t2">${esc(fmtQty(o))}, ${esc(lieuName(o.emplacementId))}</span></span><span class="plus ${inList.has(o.id) ? 'in' : ''}">${icon(inList.has(o.id) ? 'check' : 'plus')}</span></button>`;
    }).join('') : `<p class="khint">Aucun objet trouvé.</p>`;
  };
  sel.addEventListener('click', e => {
    const b = e.target.closest('button[data-k]');
    if (!b) return;
    const i = Number(b.dataset.i);
    if (b.dataset.k === 'del') items.splice(i, 1);
    else if (b.dataset.k === 'inc') items[i].quantite += 1;
    else if (b.dataset.k === 'dec') items[i].quantite = Math.max(1, items[i].quantite - 1);
    drawSel(); drawRes();
  });
  sel.addEventListener('change', e => {
    if (e.target.dataset.k !== 'qty') return;
    const i = Number(e.target.dataset.i);
    items[i].quantite = Math.max(1, parseInt(e.target.value, 10) || 1);
    e.target.value = items[i].quantite;
    if (opts.warn) drawSel();
  });
  res.addEventListener('click', e => {
    const b = e.target.closest('button[data-add]');
    if (!b) return;
    const ex = items.find(x => x.objetId === b.dataset.add);
    if (ex) ex.quantite += 1; else items.push({ objetId: b.dataset.add, quantite: 1 });
    drawSel(); drawRes();
  });
  q.addEventListener('input', drawRes);
  q.addEventListener('keydown', e => { if (e.key === 'Enter') e.preventDefault(); });
  drawSel(); drawRes();
  return { redraw() { drawSel(); drawRes(); } };
}

  });
}

/* ---------- QR codes ---------- */
let qrLoading = null;

    sc.src = 'https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js';
    sc.addEventListener('load', () => res());
    sc.addEventListener('error', () => { qrLoading = null; sc.remove(); rej(new Error('QR')); });
    document.head.appendChild(sc);

function parseCSV(text) {
  text = String(text || '').replace(/^﻿/, '');
  const first = text.split(/\r?\n/)[0] || '';
  const sep = [';', ',', '\t'].sort((a, b) => first.split(b).length - first.split(a).length)[0];
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) {
      if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += ch;
    } else if (ch === '"') q = true;
    else if (ch === sep) { row.push(cell); cell = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += ch;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(c => String(c).trim() !== ''));
}
function planImport(rows) {
  if (!rows.length) return { error: 'Le fichier est vide.' };
  const head = rows[0].map(h => norm(h).replace(/[^a-z]/g, ''));
  const col = n => head.indexOf(n);
  const C = { nom: col('nom'), cat: col('categorie'), q: col('quantite'), u: col('unite'), e: col('etat'), l: col('emplacement'), v: col('valeurunitaire'), d: col('datedachat'), la: col('lieudachat'), s: col('seuildalerte'), t: col('tags'), n: col('notes') };
  if (C.nom < 0) return { error: 'La colonne « Nom » est introuvable. Pars du modèle fourni.' };
  const cell = (r, k) => C[k] < 0 ? '' : String(r[C[k]] == null ? '' : r[C[k]]).trim();
  const catIds = new Map(Object.entries(S.cats).map(([id, c]) => [norm(c.nom), id]));
  const newCats = new Map(), newLieux = new Map();
  const findCat = name => {
    if (!name) return null;
    const k = norm(name);
    if (catIds.has(k)) return catIds.get(k);
    if (!newCats.has(k)) newCats.set(k, { key: ref('categories').push().key, nom: name });
    return newCats.get(k).key;
  };
  const findLieu = path => {
    const segs = String(path || '').split(/\s*(?:›|>)\s*/).map(x => x.trim()).filter(Boolean);
    let parent = null;
    for (const seg of segs) {
      const k = norm(seg);
      const ex = Object.keys(S.lieux).find(id => parentOf(id) === parent && norm(S.lieux[id].nom) === k);
      if (ex) { parent = ex; continue; }
      const nk = (parent || '') + '|' + k;
      if (!newLieux.has(nk)) newLieux.set(nk, { key: ref('emplacements').push().key, nom: seg, parentId: parent });
      parent = newLieux.get(nk).key;
    }
    return parent;
  };
  const etatKey = v => { if (!v) return 'bon'; const k = norm(v); const e = ETATS.find(x => norm(x.l) === k || x.k === k); return e ? e.k : null; };
  const dateIso = v => { if (!v) return null; let m = v.match(/^(\d{1,2})[/.-](\d{1,2})[/.-](\d{4})$/); if (m) return `${m[3]}-${pad2(m[2])}-${pad2(m[1])}`; m = v.match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? `${m[1]}-${m[2]}-${m[3]}` : null; };
  const numv = v => { if (!v) return null; return numOrNull(v.replace(/[€\s]/g, '').replace(',', '.')); };
  const objs = []; let skipped = 0, badEtat = 0;
  rows.slice(1).forEach(r => {
    const nom = cell(r, 'nom');
    if (!nom) { skipped++; return; }
    let etat = etatKey(cell(r, 'e'));
    if (!etat) { badEtat++; etat = 'bon'; }
    const tags = cell(r, 't').split(/[,|]/).map(x => x.trim()).filter(Boolean);
    const q = parseInt(cell(r, 'q').replace(/\s/g, ''), 10);
    objs.push({
      nom: nom.slice(0, 120),
      categorieId: findCat(cell(r, 'cat')),
      quantite: isFinite(q) && q >= 0 ? q : 1,
      unite: cell(r, 'u') || 'pièces',
      etat,
      emplacementId: findLieu(cell(r, 'l')),
      valeurUnitaire: numv(cell(r, 'v')),
      dateAchat: dateIso(cell(r, 'd')),
      lieuAchat: cell(r, 'la') || null,
      seuilAlerte: intOrNull(cell(r, 's')),
      tags: tags.length ? tags : null,
      notes: cell(r, 'n') || null
    });
  });
  return { objs, newCats: [...newCats.values()], newLieux: [...newLieux.values()], skipped, badEtat };
}
async function handleImport(file) {

    logH('Import CSV', plural(plan.objs.length, 'objet'), [plan.newCats.length ? plural(plan.newCats.length, 'catégorie créée', 'catégories créées') : '', plan.newLieux.length ? plural(plan.newLieux.length, 'emplacement créé', 'emplacements créés') : ''].filter(Boolean).join(', '));
    closeModal();

  const html = [...groups.entries()].map(([k, arr]) => `<h2 class="h2 sm">${esc(label(k))}</h2><div class="group">${arr.map(h => `<div class="item hist">
    <span class="tx"><span class="t1">${esc(h.action)}</span><span class="t2">${esc([h.cible, h.details].filter(Boolean).join(', '))}</span></span>
    <span class="end">${esc(new Date(h.date).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }))}</span></div>`).join('')}</div>`).join('');
  return `<div class="narrow">
    <section class="hero"><h1 class="display">Historique</h1><p class="count">${list.length ? plural(list.length, 'action') + (list.length >= 300 ? ', les plus récentes' : '') : 'Aucune action pour le moment'}</p></section>
    ${html || '<div class="empty"><p>Les ajouts, modifications, sorties et retours apparaîtront ici.</p></div>'}
  </div>`;
}

/* ---------- Accueil / tableau de bord ---------- */
function viewAccueil() {
  if (!S.loaded) return loading();
  const all = objList();
  const totalQ = all.reduce((s, o) => s + (Number(o.quantite) || 0), 0);
  const valeur = all.filter(o => o.etat !== 'perdu').reduce((s, o) => s + (Number(o.quantite) || 0) * (num(o.valeurUnitaire) || 0), 0);
  const hasPerdu = all.some(o => o.etat === 'perdu');
  const byName = (a, b) => String(a.nom || '').localeCompare(String(b.nom || ''), 'fr', { sensitivity: 'base' });
  const alertRow = (o, label) => {
    const c = catOf(o.categorieId);
    return `<button class="item" data-act="go" data-go="objet=${esc(o.id)}">${catSq(c, 'sm')}
      <span class="tx"><span class="t1">${esc(o.nom)}</span><span class="t2"><span class="loc">${icon('pin')}${esc(lieuName(o.emplacementId))}</span></span></span>
      <span class="end"><small>${esc(label)}</small></span></button>`;
  };
  const alerts = [];
  all.filter(o => o.etat !== 'perdu' && lowStock(o)).sort(byName).forEach(o => alerts.push(alertRow(o, 'Stock bas, ' + fmtQty(o))));
  all.filter(o => o.etat === 'reparer').sort(byName).forEach(o => alerts.push(alertRow(o, 'À réparer')));
  all.filter(o => o.etat === 'abime').sort(byName).forEach(o => alerts.push(alertRow(o, 'Abîmé')));
  all.filter(o => o.etat === 'perdu').sort(byName).forEach(o => alerts.push(alertRow(o, 'Perdu')));
  kitList().forEach(k => {
    const n = kitIssues(k).length;
    if (n) alerts.push(`<button class="item" data-act="go" data-go="kit=${esc(k.id)}">${sq('#2F6E62', 'kit', 'sm')}<span class="tx"><span class="t1">${esc(k.nom)}</span><span class="t2">Kit</span></span><span class="end"><small>${n === 1 ? '1 objet manque' : n + ' objets manquent'}</small></span></button>`);
  });
  const cats = catList();
  const counts = {};
  all.forEach(o => { const key = S.cats[o.categorieId] ? o.categorieId : '_none'; counts[key] = (counts[key] || 0) + 1; });
  const max = Math.max(1, ...Object.values(counts));
  const repart = cats.map(c => ({ id: c.id, nom: c.nom, couleur: c.couleur, icone: c.icone, emoji: catEmoji(c), n: counts[c.id] || 0 }));
  if (counts._none) repart.push({ id: '_none', nom: 'Sans catégorie', couleur: '#9A8B7F', icone: 'dots', n: counts._none });
  const repartRows = repart.map(c => `<button class="item" data-act="catChip" data-id="${esc(c.id)}">${catSq(c, 'sm')}
    <span class="tx"><span class="t1">${esc(c.nom)}</span><span class="bar2"><i style="width:${Math.round(c.n * 100 / max)}%;background:${esc(c.couleur)}"></i></span></span>
    <span class="end">${plural(c.n, 'réf.', 'réf.')}</span></button>`).join('');
  const recents = all.slice().sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)).slice(0, 5);
  return `
  <section class="hero"><h1 class="display">La Réserve</h1><p class="count">Tout ce que possède Play Thau'Gether.</p></section>
  <button class="search glass" data-act="openSearch">${icon('search')}<span class="ph">Rechercher dans la réserve</span></button>
  <div class="stats glass">
    <div><b>${fmtNum(all.length)}</b><span>${all.length > 1 ? 'références' : 'référence'}</span></div>
    <div><b>${fmtNum(totalQ)}</b><span>${totalQ > 1 ? 'objets' : 'objet'}</span></div>
    <div><b class="${fmtEur(valeur).length > 8 ? 'long' : ''}">${fmtEur(valeur)}</b><span>valeur totale${hasPerdu ? ', hors perdus' : ''}</span></div>
  </div>
  <div class="dash">
    <div>
      ${(() => { const open = sortieList().filter(isOpen); return open.length ? `<h2 class="h2">Actuellement sorti</h2><div class="group">${open.map(sortieRow).join('')}</div>` : ''; })()}
      <h2 class="h2">À surveiller</h2>
      ${alerts.length ? `<div class="group">${alerts.join('')}</div>` : `<div class="group calm"><span class="okline"><i></i>Rien à signaler.</span></div>`}
      ${recents.length ? `<h2 class="h2">Derniers ajouts</h2><div class="group">${recents.map(rowObj).join('')}</div>` : ''}
    </div>
    <div>
      <div class="h2row"><h2 class="h2">Par catégorie</h2><button class="link" data-act="go" data-go="vue=categories">${S.admin ? 'Gérer' : 'Tout voir'}</button></div>
      ${repartRows ? `<div class="group">${repartRows}</div>` : `<div class="group calm"><span class="okline">Aucune catégorie.</span></div>`}
      <h2 class="h2">Outils</h2>
      <div class="group">
        ${toolRow('data-act="go" data-go="vue=categories"', 'tag', 'Catégories', S.admin ? 'Créer, renommer, réordonner' : plural(cats.length, 'catégorie'))}
        ${toolRow('data-act="go" data-go="vue=etiquettes"', 'qr', 'Étiquettes QR', 'Planche A4 à imprimer')}
        ${toolRow('data-act="go" data-go="vue=donnees"', 'download', S.admin ? 'Exports et import' : 'Exports', "CSV et PDF pour l'assurance et l'AG")}
        ${toolRow('data-act="go" data-go="vue=historique"', 'clock', 'Historique', 'Toutes les modifications')}
      </div>
    </div>
  </div>
  ${!all.length && S.admin ? `<div class="empty"><p>${cats.length ? 'Ajoute le premier objet avec le bouton +.' : 'Commence par créer les catégories.'}</p>${cats.length ? '' : '<button class="btn" data-act="go" data-go="vue=categories">Créer les catégories</button>'}</div>` : ''}`;
}

/* ---------- Modales et messages ---------- */
function openModal(html, opts) {
  modalOpts = opts || {};
  const m = $('#modal');
  m.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  m.classList.remove('hidden');
  document.body.classList.add('noscroll');
}
function closeModal() {
  const m = $('#modal');
  if (m.classList.contains('hidden')) return;
  const cb = modalOpts.onClose;
  modalOpts = {};
  m.classList.add('hidden');
  m.innerHTML = '';
  document.body.classList.remove('noscroll');
  if (cb) cb();
}
function ask(msg, o) {
  o = o || {};
  return new Promise(res => {
    openModal(`<div class="mhead"><h2>${esc(o.title || 'Confirmation')}</h2></div><p class="mtext">${esc(msg)}</p>
      <div class="mfoot"><button class="btn sec" id="askNo">Annuler</button><button class="btn ${o.danger ? 'danger' : ''}" id="askOk">${esc(o.ok || 'Confirmer')}</button></div>`, { onClose: () => res(false) });
    $('#askOk').addEventListener('click', () => { modalOpts.onClose = null; closeModal(); res(true); });
    $('#askNo').addEventListener('click', () => closeModal());
  });
}
function info(title, msg) {
  openModal(`<div class="mhead"><h2>${esc(title)}</h2></div><p class="mtext">${esc(msg)}</p><div class="mfoot"><button class="btn" data-act="closeModal">OK</button></div>`);
}
let toastT = null;
function toast(m) {
  const t = $('#toast');
  t.textContent = m;
  t.classList.add('on');
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove('on'), 2800);
}

/* ---------- Actions ---------- */
function resetFilters() { UI.lieu = ''; UI.etat = ''; UI.tag = ''; UI.sort = 'nom'; }
const ACT = {
  go: d => go(d.go || ''),
  back: () => back(),
  login: () => login(),
  logout: () => logout(),
  closeModal: () => closeModal(),
  mode: d => { UI.mode = d.m; lsSet(MODE_KEY, d.m); updateCatalogue(); },
  toggleFilters: () => { UI.filtersOpen = !UI.filtersOpen; updateCatalogue(); },
  resetFilters: () => { resetFilters(); updateCatalogue(); },
  resetAll: () => { resetFilters(); UI.q = ''; UI.cat = ''; const q = $('#q'); if (q) q.value = ''; updateCatalogue(); },
  catChip: d => {
    if (route().v === 'catalogue') { UI.cat = UI.cat === d.id && d.id ? '' : d.id; updateCatalogue(); }
    else { UI.cat = d.id; UI.q = ''; resetFilters(); go('vue=catalogue'); }
  },
  tagFilter: d => { UI.q = ''; UI.cat = ''; resetFilters(); UI.tag = d.tag; go('vue=catalogue'); },
  lieuFilter: d => { UI.q = ''; UI.cat = ''; resetFilters(); UI.lieu = d.id; UI.filtersOpen = true; go('vue=catalogue'); },
  addObj: d => formObj(null, d.lieu ? { emplacementId: d.lieu } : (UI.cat && UI.cat !== '_none' ? { categorieId: UI.cat } : null)),
  editObj: d => formObj(d.id),
  dupObj: d => dupObj(d.id),
  delObj: d => delObj(d.id),
  qty: d => adjustQty(d.id, Number(d.d)),
  addLieu: d => formLieu(null, d.parent || null),
  editLieu: d => formLieu(d.id),
  delLieu: d => delLieu(d.id),
  addCat: () => formCat(null),
  editCat: d => formCat(d.id),
  delCat: d => delCat(d.id),
  moveCat: d => moveCat(d.id, Number(d.dir)),
  seedCats: () => seedCats(),
  openSearch: () => { UI.q = ''; UI.cat = ''; resetFilters(); go('vue=catalogue'); const q = $('#q'); if (q) q.focus(); },
  kitMode: d => { UI.kitMode = d.m; render(); },
  kitCheck: (d, e, b) => toggleCheck(b),
  kitReset: d => { saveCheck(d.kit, { depart: {}, retour: {} }); render(); },
  addKit: () => formKit(null),
  editKit: d => formKit(d.id),
  delKit: d => delKit(d.id),
  addSortie: () => formSortie(null),
  editSortie: d => formSortie(d.id),
  delSortie: d => delSortie(d.id),
  retour: d => formRetour(d.id),
  sortieFromKit: d => sortieFromKit(d.id),
  showQR: d => showQR(d.type, d.id),
  addLabel: d => { UI.labels.add(d.type + ':' + d.id); UI.labTab = d.type; UI.labQ = ''; closeModal(); go('vue=etiquettes'); },
  labTab: d => { UI.labTab = d.t; UI.labQ = ''; render(); },
  labSize: d => { UI.labSize = d.s; render(); },
  labToggle: (d, e, b) => {
    if (UI.labels.has(d.key)) UI.labels.delete(d.key); else UI.labels.add(d.key);
    b.closest('.item').classList.toggle('done', UI.labels.has(d.key));
    const c = $('#labCount'); if (c) c.textContent = labCountText();
  },
  labAll: () => { labVisibleKeys().forEach(k => UI.labels.add(k)); updateLabelList(); },
  labNone: () => { labVisibleKeys().forEach(k => UI.labels.delete(k)); updateLabelList(); },
  printLabels: () => printLabels(),
  exportAll: () => exportCSV(objList().sort((a, b) => String(a.nom || '').localeCompare(String(b.nom || ''), 'fr', { sensitivity: 'base' }))),
  exportFiltered: () => exportCSV(filtered()),
  printInv: () => printInventory(),
  tplCSV: () => templateCSV()
};
const ADMIN_ACTS = new Set(['addObj', 'editObj', 'dupObj', 'delObj', 'qty', 'addLieu', 'editLieu', 'delLieu', 'addCat', 'editCat', 'delCat', 'moveCat', 'seedCats', 'addKit', 'editKit', 'delKit', 'addSortie', 'editSortie', 'delSortie', 'retour', 'sortieFromKit', 'tplCSV']);

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (!ACT[a]) return;
  if (ADMIN_ACTS.has(a) && !S.admin) return;
  e.preventDefault();
  ACT[a](b.dataset, e, b);
});
let searchT = null;
document.addEventListener('input', e => {
  const k = e.target.dataset && e.target.dataset.in;
  if (k === 'labq') { UI.labQ = e.target.value; updateLabelList(); return; }
  if (k !== 'q') return;
  UI.q = e.target.value;
  clearTimeout(searchT);
  searchT = setTimeout(updateCatalogue, 120);
});
document.addEventListener('change', e => {
  if (e.target.id === 'csvFile') { const f = e.target.files && e.target.files[0]; e.target.value = ''; handleImport(f); return; }
  const k = e.target.dataset && e.target.dataset.in;
  if (!k || k === 'q' || k === 'labq') return;
  UI[k] = e.target.value;
  updateCatalogue();
});
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal' && !modalOpts.persist) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
window.addEventListener('popstate', () => { closeModal(); render(); });
window.addEventListener('online', () => { S.online = true; renderChrome(); });
window.addEventListener('offline', () => { S.online = false; renderChrome(); });

/* ---------- Démarrage ---------- */
function boot() {
  document.body.classList.add('first');
  setTimeout(() => document.body.classList.remove('first'), 1600);
  loadCache();
  S.configured = typeof firebase !== 'undefined' && !String(FIREBASE_CONFIG.apiKey).startsWith('A_REMPLIR');
  if (S.configured) {
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.database();
    auth = firebase.auth();
    auth.onAuthStateChanged(onAuth);
    auth.getRedirectResult().catch(authError);
    listen('categories', 'cats');
    listen('emplacements', 'lieux');
    listen('objets', 'objets');
    listen('kits', 'kits');
    listen('sorties', 'sorties');
  } else {
    S.loaded = true;
  }
  render();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => { });
  setTimeout(() => loadQR().catch(() => { }), 5000);
}
boot();
</script>
